<!DOCTYPE html>
<html>
  <head>
    <title>React Basics</title>
    <style>
       .inputs {
         padding: 13px 30px;
         font-size: 18px;
         margin-bottom: 10px;
         border-radius: 9px;
         border-width: 2px;
       }
       .btn{
        padding: 14px 20px;
        color: white;
        margin-left: 10px;
        background-color: rgb(0,123,255);
        border: none;
        border-radius: 8px;
        font-size: 16px;
       }
       .para{
        font-size: 22px;
        font-family: Arial, Helvetica, sans-serif;
        font-weight: bold;
       }
    </style>
  </head>
  <body>
    <div class="js-container"></div>
    <script src="https://unpkg.com/supersimpledev/dayjs.js"></script>
    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">

    function MyWeb(){
      const [typeWord,setTypeWord] = React.useState("password")
      function changeWord(){
        if(typeWord === "password"){
        setTypeWord("text")
        } else if (typeWord === "text"){
          setTypeWord("password")
        }
      }
      return(
        <>
          <p className="para">Hello, welcome to my website</p>
          <div>
          <input placeholder="Email" className="inputs" />
          </div>
          <div>
          <input placeholder="Password" className="inputs" type={typeWord} />
          <button onClick={changeWord}>show</button>
          </div>
          <button className="btn">Login</button>
          <button className="btn">Sign Up</button>
        </>
      )
    }

     function App(){
        return(
            <>
             <MyWeb />
           </>
        ) 
     }


      const container = document.querySelector('.js-container');
      const root =  ReactDOM.createRoot(container)
      root.render(<App />);
    </script>
  </body>
</html>
